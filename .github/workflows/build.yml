name: Build Gems

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Whether to upload gem artifacts"
        type: boolean
        default: true
        required: false

jobs:
  # Test on multiple Ruby versions and platforms
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.0", "3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake spec

  # Build native gems for different platforms using rake-compiler-dock
  cross-gem:
    name: Build native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
          - x64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build native gem for ${{ matrix.platform }}
        run: |
          bundle exec rake native:${{ matrix.platform }}:gem
        env:
          RUBY_CC_VERSION: "3.0.0:3.1.0:3.2.0:3.3.0"

      - name: Upload gem artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem
          retention-days: 1

  # Build the source gem (no pre-built binary)
  source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build source gem
        run: gem build rscsv.gemspec

      - name: Upload gem artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-gem
          path: "rscsv-*.gem"
          retention-days: 1
